[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syamroi-postmortem"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对事故复盘的证据链相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "syamroi" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://syamroi.github.io"
Repository = "https://github.com/syamroi/postmortem"
Issues = "https://github.com/syamroi/postmortem/issues"

[project.scripts]
postmortem = "postmortem:main"

[tool.setuptools]
py-modules = ["postmortem"]
